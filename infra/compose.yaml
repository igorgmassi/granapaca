# Sua instância do GranaPaCá: API + PostgreSQL. Como usar: infra/README.md.
name: granapaca

services:
  api:
    build: ../backend
    image: granapaca-api:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-granapaca}
      POSTGRES_USER: ${POSTGRES_USER:-granapaca}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      GRANAPACA_MASTER_KEY_FILE: /run/secrets/master_key
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-}
      TZ: ${TZ:-America/Sao_Paulo}
    secrets:
      - postgres_password
      - master_key
    volumes:
      - appdata:/var/lib/granapaca/files
    # Só localhost: para acessar de fora, use a rede privada (Tailscale), nunca a porta aberta.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "GranaPaCa.Api.dll", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-granapaca}
      POSTGRES_USER: ${POSTGRES_USER:-granapaca}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${TZ:-America/Sao_Paulo}
    secrets:
      - postgres_password
    # No published port: only the API reaches the database, through the compose network.
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18, so the volume mounts the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  master_key:
    file: ./secrets/master_key.txt

volumes:
  pgdata:
  appdata:
