# Atualizações automáticas de dependências.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
