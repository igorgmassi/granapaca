name: infra

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - backend/**
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-up:
    name: compose-up
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same steps as infra/README.md: copy the example and fill in the password.
      - run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 32)/" .env
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/health
      # A restart keeps the volume: the migrations find nothing pending and the API comes back healthy.
      - run: docker compose down && docker compose up --detach --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  image-multi-arch:
    name: image-multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The default builder cannot hold a multi-platform image; a docker-container builder can.
      - run: docker buildx create --use
      - run: docker buildx build --platform linux/amd64,linux/arm64 backend
