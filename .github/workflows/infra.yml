name: infra

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - backend/**
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-up:
    name: compose-up
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check shell script syntax
        run: find . -name '*.sh' -exec bash -n {} +
      # Same steps as infra/README.md: generate Docker secrets and copy the env example.
      - name: Initialize secrets and env
        run: |
          ./init-secrets.sh
          cp .env.example .env
      - name: Start compose stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify /health and Synthetic provider mode
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          server_info="$(curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/server-info)"
          echo "$server_info"
          echo "$server_info" | jq -e '.providerMode == "synthetic"'
      - name: Verify /api/v1/auth/setup with America/Sao_Paulo timezone
        run: |
          setup_payload="$(jq -n \
            --arg email 'owner@demo.local' \
            --arg displayName 'Owner Demo' \
            --arg password 'DemoSetup!2026#Tz' \
            --arg timezone 'America/Sao_Paulo' \
            '{email: $email, displayName: $displayName, password: $password, timezone: $timezone}')"
          setup_response="$(printf '%s' "$setup_payload" | curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            http://127.0.0.1:8080/api/v1/auth/setup)"
          echo "$setup_response" | jq -e '.email == "owner@demo.local" and (.ownerId | length > 0)'
      - name: Ensure database password is not exposed in container env
        run: |
          api_env="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' granapaca-api-1)"
          db_env="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' granapaca-db-1)"
          if printf '%s\n%s\n' "$api_env" "$db_env" | grep -qE '^(POSTGRES_PASSWORD|ConnectionStrings__Postgres)='; then
            echo "ERROR: database password leaked into container environment variables."
            exit 1
          fi
      # A restart keeps the volume: the migrations find nothing pending and the API comes back healthy.
      - name: Restart stack preserving volume
        run: docker compose down && docker compose up --detach --wait --wait-timeout 120
      - name: Verify /health and owner persistence after restart
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/server-info | jq -e '.ownerConfigured == true'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: |
          docker compose down --volumes
          rm -rf secrets .env

  image-multi-arch:
    name: image-multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The default builder cannot hold a multi-platform image; a docker-container builder can.
      - run: docker buildx create --use
      - run: docker buildx build --platform linux/amd64,linux/arm64 backend
