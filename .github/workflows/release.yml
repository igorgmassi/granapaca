name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push multi-arch image to GHCR (defaults to dry-run build only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: granapaca-api

jobs:
  release-api:
    name: release-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every push (tag or manual dispatch with push=true) publishes with SBOM/provenance and signs via Cosign; manual dispatches default to a dry-run build.
      - name: Determine publish and signing mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          REGISTRY_HOST: ${{ env.REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_BASENAME: ${{ env.IMAGE_NAME }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUSH" = "true" ]; then
            should_push="true"
          else
            should_push="false"
          fi

          # Never publish an unsigned image: sign every pushed digest with Cosign keyless OIDC.
          should_sign="$should_push"

          image_ref="$(printf '%s/%s/%s' "$REGISTRY_HOST" "$REPO_OWNER" "$IMAGE_BASENAME" | tr '[:upper:]' '[:lower:]')"
          {
            echo "should_push=$should_push"
            echo "should_sign=$should_sign"
            echo "image_ref=$image_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.mode.outputs.should_push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.mode.outputs.image_ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=GranaPaCá API
            org.opencontainers.image.description=Self-hosted personal finance API (.NET 10, read-only Open Finance)
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push multi-arch API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.mode.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ steps.mode.outputs.should_push == 'true' }}
          provenance: ${{ steps.mode.outputs.should_push == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: steps.mode.outputs.should_sign == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless Sigstore signing by immutable digest via GitHub OIDC (ADR-028).
      - name: Sign container image digest with Cosign
        if: steps.mode.outputs.should_sign == 'true'
        env:
          IMAGE_REF: ${{ steps.mode.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "ERROR: container image digest output is empty."
            exit 1
          fi
          cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"
