<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" role="img" aria-labelledby="t"><title id="t">Componentes: avisos, tema claro</title><rect width="960" height="604" fill="#FBF5EC"/><text x="24" y="36" font-family="'Baloo 2', ui-rounded, system-ui, sans-serif" font-size="18" font-weight="600" fill="#2A1C12" text-anchor="start">Avisos e estados</text><text x="24" y="66" font-family="Figtree, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B5546" text-anchor="start">Aviso rápido (some sozinho)</text><rect x="24" y="76" width="400" height="48" rx="12" fill="#3B2D23"/><text x="40" y="105" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#F7EFE6" text-anchor="start">Categoria alterada para Lazer.</text><text x="408" y="105" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E8A066" text-anchor="end">Desfazer</text><text x="464" y="66" font-family="Figtree, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B5546" text-anchor="start">Faixa de alerta</text><rect x="464" y="76" width="472" height="88" rx="20" fill="#FCDDD5"/><path d="M12 4 3 20h18ZM12 10v5M12 17.5h.01" transform="translate(480 92) scale(1)" fill="none" stroke="#4D1307" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="516" y="104" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4D1307" text-anchor="start">A conexão com o Banco Jatobá vence em 5 dias</text><text x="516" y="126" font-family="Figtree, Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#4D1307" text-anchor="start">Renove para o extrato continuar chegando.</text><text x="516" y="150" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4D1307" text-anchor="start">Renovar agora</text><text x="24" y="196" font-family="Figtree, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B5546" text-anchor="start">Diálogo</text><rect x="24" y="206" width="400" height="196" rx="28" fill="#F3ECE2" stroke="#E5D9CA" stroke-width="1"/><text x="48" y="246" font-family="Figtree, Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#2A1C12" text-anchor="start">Desconectar o Banco Ipê?</text><text x="48" y="276" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#6B5546" text-anchor="start">Os lançamentos já baixados continuam no app.</text><text x="48" y="296" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#6B5546" text-anchor="start">Novos lançamentos deixam de chegar.</text><text x="272" y="366" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#A0521A" text-anchor="end">Cancelar</text><rect x="288" y="340" width="112" height="40" rx="20" fill="#B83A22"/><text x="344" y="365" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Desconectar</text><text x="464" y="196" font-family="Figtree, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B5546" text-anchor="start">Estado vazio</text><rect x="464" y="206" width="472" height="196" rx="20" fill="#FFFFFF" stroke="#E5D9CA" stroke-width="1"/><circle cx="524" cy="304" r="36" fill="#E8A066" opacity="0.5"/><text x="580" y="286" font-family="'Baloo 2', ui-rounded, system-ui, sans-serif" font-size="20" font-weight="600" fill="#2A1C12" text-anchor="start">Nada por aqui ainda</text><text x="580" y="310" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#6B5546" text-anchor="start">Conecte um banco para ver seus</text><text x="580" y="330" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#6B5546" text-anchor="start">lançamentos neste extrato.</text><rect x="580" y="346" width="136" height="40" rx="20" fill="#A0521A"/><text x="648" y="371" font-family="Figtree, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Conectar banco</text><text x="24" y="438" font-family="Figtree, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B5546" text-anchor="start">Carregando (esqueleto)</text><rect x="24" y="448" width="400" height="132" rx="20" fill="#FFFFFF" stroke="#E5D9CA" stroke-width="1"/><circle cx="60" cy="484" r="20" fill="#F0E7DB"/><rect x="92" y="468" width="150" height="14" rx="7" fill="#F0E7DB"/><rect x="92" y="490" width="100" height="10" rx="5" fill="#F0E7DB"/><rect x="336" y="474" width="72" height="16" rx="8" fill="#F0E7DB"/><circle cx="60" cy="540" r="20" fill="#F0E7DB"/><rect x="92" y="524" width="150" height="14" rx="7" fill="#F0E7DB"/><rect x="92" y="546" width="100" height="10" rx="5" fill="#F0E7DB"/><rect x="336" y="530" width="72" height="16" rx="8" fill="#F0E7DB"/><text x="464" y="438" font-family="Figtree, Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B5546" text-anchor="start">Passos e carregamento com pintas</text><circle cx="468" cy="470" r="4" fill="#A0521A" stroke="#A0521A" stroke-width="1.5"/><circle cx="480" cy="470" r="4" fill="#A0521A" stroke="#A0521A" stroke-width="1.5"/><circle cx="492" cy="470" r="4" fill="none" stroke="#94816E" stroke-width="1.5"/><text x="512" y="475" font-family="Figtree, Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2A1C12" text-anchor="start">Passo 2 de 3</text><circle cx="468" cy="512" r="4" fill="#A0521A" stroke="#A0521A" stroke-width="1.5"/><circle cx="480" cy="512" r="4" fill="none" stroke="#A0521A" stroke-width="1.5"/><circle cx="492" cy="512" r="4" fill="none" stroke="#A0521A" stroke-width="1.5"/><text x="512" y="517" font-family="Figtree, Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2A1C12" text-anchor="start">Buscando seus lançamentos…</text><rect x="464" y="544" width="300" height="8" rx="4" fill="#F0E7DB"/><rect x="464" y="544" width="186" height="8" rx="4" fill="#A0521A"/><text x="776" y="553" font-family="Figtree, Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#2A1C12" text-anchor="start">62% da meta</text></svg>
